<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>免費版德州撲克訓練室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app app-shell">
    <header class="client-bar" aria-label="大廳狀態">
      <div class="window-dots shell-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="client-brand">
        <span class="eyebrow">Casino Trainer Room</span>
        <h1>德州撲克訓練室</h1>
      </div>
      <div class="client-stats meters">
        <div><span>總手數</span><strong id="totalHands">0</strong></div>
        <div><span>總損益</span><strong id="totalProfit">0</strong></div>
        <div><span>桌數</span><strong id="tableCount">1 / 4</strong></div>
        <div><span>顯示</span><strong id="displayModeText">籌碼</strong></div>
      </div>
      <div class="client-status">
        <div class="hint" id="activeTableText">目前桌：Table 1</div>
        <div class="status" id="statusText">選一桌後按「目前桌發牌」。</div>
      </div>
    </header>

    <section class="client-main">
      <section class="arena-shell">
        <div class="arena-header">
          <div class="stage-pill">Cash Game Lobby</div>
          <div class="stage-pill muted">最多四桌</div>
          <div class="stage-pill muted">NL Hold'em</div>
        </div>
        <section class="tables-grid" id="tablesGrid" aria-label="牌桌"></section>
        <section class="bottom-dock" id="bottomDock" aria-label="目前桌操作"></section>
      </section>

      <aside class="inspector-shell">
        <details class="console-drawer" open>
          <summary>桌況控制</summary>
          <section class="toolbar client-controls" aria-label="多桌控制">
            <button id="addTableBtn" class="primary">開新桌</button>
            <button id="allTablesBtn" class="primary">四桌同時開打</button>
            <button id="newHandBtn">目前桌發牌</button>
            <label class="select-box">
              <span>籌碼顯示</span>
              <select id="displayMode">
                <option value="chips">籌碼</option>
                <option value="bb">BB 數</option>
                <option value="cash">現金</option>
              </select>
            </label>
            <label class="select-box">
              <span>現金匯率</span>
              <select id="cashRate">
                <option value="0.01">$0.01 / chip</option>
                <option value="0.05">$0.05 / chip</option>
                <option value="0.1">$0.10 / chip</option>
              </select>
            </label>
            <label class="toggle">
              <input id="autoInsurance" type="checkbox">
              <span>自動提示保險</span>
            </label>
          </section>
        </details>

        <details class="console-drawer">
          <summary>即時建議</summary>
          <div id="advice" class="panel-body compact-panel">
            <p>不確定時點「建議」，我會依目前桌的手牌、位置、彩池與行動壓力給你下一步。</p>
          </div>
        </details>

        <details class="console-drawer">
          <summary>目前桌紀錄</summary>
          <div class="log panel-body compact-panel" id="log"></div>
        </details>

        <details class="console-drawer">
          <summary>打完解析</summary>
          <div id="analysis" class="panel-body compact-panel">
            <p>完成一手後會顯示勝負、牌型、位置、彩池賠率、保險結果與下次建議。</p>
          </div>
        </details>

        <details class="console-drawer">
          <summary>每 10 局檢討</summary>
          <div id="review" class="panel-body compact-panel">
            <p>累積打滿 10 手後，這裡會整理 VPIP、PFR、勝率、損益、保險使用與策略建議。</p>
          </div>
        </details>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
